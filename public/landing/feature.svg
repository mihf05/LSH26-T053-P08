<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 693 502" width="693" height="502" role="img"
     aria-label="A subject trace: for every subject the mark used, the grade point and the rule that decided it.">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#a8d3ff"/>
      <stop offset="1" stop-color="#fff4df"/>
    </linearGradient>
    <clipPath id="frame"><rect width="693" height="502" rx="16"/></clipPath>
    <style>
      .t  { font-family: "Radio Canada Big", ui-sans-serif, system-ui, sans-serif; }
      .m  { font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, monospace; }
      .lbl{ font-size: 11px; fill: #6c6c6c; letter-spacing: .06em; }
      .sub{ font-size: 13.5px; fill: #000; font-weight: 500; }
      .num{ font-size: 13px; fill: #1f2937; }
      .rl { font-size: 11px; fill: #6c6c6c; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="693" height="502" fill="url(#sky)"/>
    <!-- soft paper shapes, so the card sits on something -->
    <rect x="368" y="-40" width="300" height="300" rx="28" fill="#ffffff" opacity=".28" transform="rotate(12 518 110)"/>
    <rect x="20" y="330" width="320" height="260" rx="28" fill="#ffffff" opacity=".22" transform="rotate(-8 180 460)"/>

    <!-- trace card -->
    <g transform="translate(38 44)">
      <rect width="617" height="414" rx="14" fill="#fff"/>

      <!-- header -->
      <text class="t" x="26" y="38" font-size="17" font-weight="600" fill="#000">Nusrat Jahan Oishee</text>
      <text class="m" x="26" y="58" font-size="11.5" fill="#6c6c6c">Class 10 · Science · Roll 01</text>
      <rect x="486" y="20" width="105" height="42" rx="8" fill="#fff546"/>
      <text class="m" x="538" y="38" font-size="10" fill="#66640f" text-anchor="middle">FINAL GPA</text>
      <text class="t" x="538" y="55" font-size="15" font-weight="600" fill="#000" text-anchor="middle">0.00 · F</text>

      <!-- column heads -->
      <line x1="26" y1="78" x2="591" y2="78" stroke="#dbe0ec"/>
      <text class="m lbl" x="26"  y="96">SUBJECT</text>
      <text class="m lbl" x="214" y="96">MARK USED</text>
      <text class="m lbl" x="372" y="96" text-anchor="end">GP</text>
      <text class="m lbl" x="392" y="96">RULE</text>
      <line x1="26" y1="106" x2="591" y2="106" stroke="#000" stroke-width="1.5"/>

      <!-- rows -->
      <g>
        <text class="t sub" x="26"  y="130">Bangla</text>
        <text class="m num" x="214" y="130">85</text>
        <text class="m num" x="372" y="130" text-anchor="end">5.00</text>
        <text class="m rl"  x="392" y="130">R-10 · 80–100 band</text>
        <line x1="26" y1="144" x2="591" y2="144" stroke="#dbe0ec"/>

        <text class="t sub" x="26"  y="168">English</text>
        <text class="m num" x="214" y="168">82</text>
        <text class="m num" x="372" y="168" text-anchor="end">5.00</text>
        <text class="m rl"  x="392" y="168">R-10 · 80–100 band</text>
        <line x1="26" y1="182" x2="591" y2="182" stroke="#dbe0ec"/>

        <!-- the row that decided the result -->
        <rect x="14" y="186" width="589" height="44" rx="8" fill="#fff546" opacity=".38"/>
        <rect x="14" y="186" width="3.5" height="44" rx="2" fill="#000"/>
        <text class="t sub" x="26"  y="206">Mathematics</text>
        <text class="m num" x="214" y="206" fill="#000">29</text>
        <text class="m num" x="372" y="206" text-anchor="end" font-weight="700" fill="#000">0.00</text>
        <text class="m rl"  x="392" y="206" fill="#000">R-11 · theory 29 &lt; pass 33</text>
        <text class="m"     x="26"  y="222" font-size="10.5" fill="#66640f">Subject fails on its own part — the whole result cancels (R-13)</text>
        <line x1="26" y1="230" x2="591" y2="230" stroke="#dbe0ec"/>

        <text class="t sub" x="26"  y="254">Physics</text>
        <text class="m num" x="214" y="254">84 <tspan fill="#6c6c6c">(62T + 22P)</tspan></text>
        <text class="m num" x="372" y="254" text-anchor="end">5.00</text>
        <text class="m rl"  x="392" y="254">R-10 · 80–100 band</text>
        <line x1="26" y1="268" x2="591" y2="268" stroke="#dbe0ec"/>

        <text class="t sub" x="26"  y="292">Chemistry</text>
        <text class="m num" x="214" y="292">81 <tspan fill="#6c6c6c">(60T + 21P)</tspan></text>
        <text class="m num" x="372" y="292" text-anchor="end">5.00</text>
        <text class="m rl"  x="392" y="292">R-10 · 80–100 band</text>
        <line x1="26" y1="306" x2="591" y2="306" stroke="#dbe0ec"/>

        <text class="t sub" x="26"  y="330">Biology</text>
        <text class="m num" x="214" y="330">78 <tspan fill="#6c6c6c">(58T + 20P)</tspan></text>
        <text class="m num" x="372" y="330" text-anchor="end">4.00</text>
        <text class="m rl"  x="392" y="330">R-10 · 70–79 band</text>
        <line x1="26" y1="344" x2="591" y2="344" stroke="#dbe0ec"/>

        <text class="t sub" x="26"  y="368">Higher Maths <tspan class="m" font-size="10" fill="#6c6c6c">OPTIONAL</tspan></text>
        <text class="m num" x="214" y="368">82 <tspan fill="#6c6c6c">(60T + 22P)</tspan></text>
        <text class="m num" x="372" y="368" text-anchor="end">5.00</text>
        <text class="m rl"  x="392" y="368">R-13 · bonus max(0, 5−2) = 3</text>
        <line x1="26" y1="382" x2="591" y2="382" stroke="#000" stroke-width="1.5"/>
      </g>

      <!-- footer working -->
      <text class="m" x="26"  y="401" font-size="11" fill="#6c6c6c">Uncancelled GPA 4.50 · average 74.43</text>
      <text class="m" x="591" y="401" font-size="11" fill="#000" text-anchor="end">R-13 compulsory failure → 0.00</text>
    </g>
  </g>
</svg>
